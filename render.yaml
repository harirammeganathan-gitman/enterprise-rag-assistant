services:
  - type: web
    name: enterprise-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL_NAME
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false
      - key: API_ACCESS_KEY
        sync: false
      - key: REQUIRE_API_KEY
        value: "true"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DATA_DIR
        value: /app/data/index

  - type: web
    name: enterprise-rag-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: streamlit run app/ui.py --server.address=0.0.0.0 --server.port=10000
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: enterprise-rag-api
          property: host
      - key: API_ACCESS_KEY
        sync: false
