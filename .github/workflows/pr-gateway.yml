name: PR Gateway

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m black --check src app tests

      - name: Lint
        run: python -m flake8 src app tests --max-line-length=88 --extend-ignore=E203,W503

      - name: Run tests
        run: python -m pytest -q

      - name: Build production Docker image
        run: docker build --tag enterprise-rag-assistant:pr .
